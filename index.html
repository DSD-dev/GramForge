<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GramForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <header>
    <div class="header-row">
      <div class="brand">
        <img src="icon.png" alt="" class="header-icon">
        <span class="brand-name">GramForge</span>
      </div>
      <button id="lang-toggle" class="lang-btn">RU</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-card glass3d">
        <div class="hero-icon-wrap">
          <img src="icon.png" alt="GramForge" class="hero-icon">
        </div>
        <h1 class="hero-title" data-i18n="title">A Telegram Client<br>Built Different</h1>
        <p class="hero-sub" data-i18n="sub">Fast, clean Android client with a focus on performance and design</p>
        <a href="https://github.com/DSD-dev/GramForge/releases/download/v2.8/GramForge_2.8.apk" download class="dl-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span data-i18n="download">Download APK</span>
        </a>
      </div>
    </section>

    <section class="screens-section reveal">
      <p class="section-label" data-i18n="screensLabel">Screenshots</p>
      <div class="screens-track">
        <figure class="screen-card glass3d">
          <img src="screen1.png" alt="Screenshot 1">
        </figure>
        <figure class="screen-card glass3d">
          <img src="screen2.png" alt="Screenshot 2">
        </figure>
        <figure class="screen-card glass3d">
          <img src="screen3.png" alt="Screenshot 3">
        </figure>
      </div>
    </section>
  </main>

  <footer class="reveal">
    <p data-i18n="footer">Created by DMTech</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
